<svg width="680" height="460" viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg" role="img">
<title>트리 구조 다이어그램</title>
<desc>루트, 리프, 비단말 노드로 구성된 트리 구조와 레벨, 서브트리를 나타낸 그림</desc>

<rect width="680" height="460" fill="#ffffff"/>

<!-- 범례 -->
<rect x="40" y="36" width="150" height="72" rx="6" fill="none" stroke="#b4b2a9" stroke-width="0.5"/>
<circle cx="62" cy="58" r="9" fill="none" stroke="#2c2c2a" stroke-width="1"/>
<text x="80" y="62" font-family="sans-serif" font-size="14" fill="#2c2c2a">노드</text>
<line x1="52" y1="88" x2="72" y2="88" stroke="#2c2c2a" stroke-width="1"/>
<text x="80" y="92" font-family="sans-serif" font-size="14" fill="#2c2c2a">가지</text>

<!-- 제목 -->
<text x="640" y="52" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="500" fill="#2c2c2a">루트는 1개입니다.</text>
<path d="M560 55 L350 55 L350 92" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 3"/>

<!-- 위쪽/아래쪽 화살표 -->
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<line x1="80" y1="120" x2="80" y2="360" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="80" y="108" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5f5e5a">위쪽</text>
<text x="80" y="376" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5f5e5a">아래쪽</text>

<!-- 서브트리 강조 영역 -->
<rect x="145" y="168" width="185" height="205" rx="14" fill="#B5D4F4" opacity="0.5"/>

<!-- 가지(edge) -->
<line x1="350" y1="110" x2="250" y2="190" stroke="#5f5e5a" stroke-width="0.5"/>
<line x1="350" y1="110" x2="350" y2="190" stroke="#5f5e5a" stroke-width="0.5"/>
<line x1="350" y1="110" x2="450" y2="190" stroke="#5f5e5a" stroke-width="0.5"/>

<line x1="250" y1="190" x2="200" y2="270" stroke="#5f5e5a" stroke-width="0.5"/>
<line x1="250" y1="190" x2="300" y2="270" stroke="#5f5e5a" stroke-width="0.5"/>

<line x1="450" y1="190" x2="400" y2="270" stroke="#5f5e5a" stroke-width="0.5"/>
<line x1="450" y1="190" x2="500" y2="270" stroke="#5f5e5a" stroke-width="0.5"/>

<line x1="200" y1="270" x2="170" y2="350" stroke="#5f5e5a" stroke-width="0.5"/>
<line x1="200" y1="270" x2="230" y2="350" stroke="#5f5e5a" stroke-width="0.5"/>

<!-- 레벨0 : 루트 -->
<circle cx="350" cy="110" r="20" fill="#ffffff" stroke="#5f5e5a" stroke-width="0.5"/>
<text x="350" y="115" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2c2c2a">루트</text>

<!-- 레벨1 -->
<circle cx="250" cy="190" r="20" fill="#ffffff" stroke="#5f5e5a" stroke-width="0.5"/>
<text x="250" y="195" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2c2c2a">X</text>
<circle cx="350" cy="190" r="20" fill="#ffffff" stroke="#5f5e5a" stroke-width="0.5"/>
<text x="350" y="195" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2c2c2a">리프</text>
<circle cx="450" cy="190" r="20" fill="#ffffff" stroke="#5f5e5a" stroke-width="0.5"/>

<!-- 레벨2 -->
<circle cx="200" cy="270" r="20" fill="#ffffff" stroke="#5f5e5a" stroke-width="0.5"/>
<text x="200" y="275" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2c2c2a">Y</text>
<circle cx="300" cy="270" r="20" fill="#ffffff" stroke="#5f5e5a" stroke-width="0.5"/>
<text x="300" y="275" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2c2c2a">리프</text>
<circle cx="400" cy="270" r="20" fill="#ffffff" stroke="#5f5e5a" stroke-width="0.5"/>
<text x="400" y="275" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2c2c2a">리프</text>
<circle cx="500" cy="270" r="20" fill="#ffffff" stroke="#5f5e5a" stroke-width="0.5"/>
<text x="500" y="275" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2c2c2a">리프</text>

<!-- 레벨3 -->
<circle cx="170" cy="350" r="20" fill="#ffffff" stroke="#5f5e5a" stroke-width="0.5"/>
<text x="170" y="355" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2c2c2a">리프</text>
<circle cx="230" cy="350" r="20" fill="#ffffff" stroke="#5f5e5a" stroke-width="0.5"/>
<text x="230" y="355" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2c2c2a">리프</text>

<!-- 레벨 표시 -->
<line x1="560" y1="110" x2="600" y2="110" stroke="#888780" stroke-width="0.5" stroke-dasharray="2 3"/>
<text x="606" y="115" font-family="sans-serif" font-size="12" fill="#5f5e5a">레벨0</text>
<line x1="560" y1="190" x2="600" y2="190" stroke="#888780" stroke-width="0.5" stroke-dasharray="2 3"/>
<text x="606" y="195" font-family="sans-serif" font-size="12" fill="#5f5e5a">레벨1</text>
<line x1="560" y1="270" x2="600" y2="270" stroke="#888780" stroke-width="0.5" stroke-dasharray="2 3"/>
<text x="606" y="275" font-family="sans-serif" font-size="12" fill="#5f5e5a">레벨2</text>
<line x1="560" y1="350" x2="600" y2="350" stroke="#888780" stroke-width="0.5" stroke-dasharray="2 3"/>
<text x="606" y="355" font-family="sans-serif" font-size="12" fill="#5f5e5a">레벨3</text>

<!-- 설명 -->
<rect x="90" y="405" width="500" height="30" rx="6" fill="none" stroke="#b4b2a9" stroke-width="0.5"/>
<text x="340" y="425" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5f5e5a">파란색 표시는 노드 X를 루트로 하는 서브트리입니다.</text>
</svg>
